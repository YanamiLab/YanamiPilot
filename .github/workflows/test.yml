name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
